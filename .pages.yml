# Pages CMS – redigeringsgrensesnittet for hpgt.com (https://pagescms.org).
# Bidragsytere inviteres på e-post og ser bare det som er satt opp her.
# Teknisk oppsett (site.json, menu.json, kode, arbeidsflyter) er bevisst IKKE med:
# det kan bare endres av de med tilgang til GitHub-repoet (minste privilegium).
#
# Navnene (name), mappene og feltnavnene er engelske. Det redaktørene ser, er label og description, som er norske:
# et felt uten label vises med navnet sitt, så alle synlige felt har label.

media:
  # Bilder og dokumenter ligger i public/media/ (se README). Hvert bildefelt laster opp til sin egen mappe.
  - name: images
    label: Bilder
    input: public/media
    output: /media
    categories: [image]
  - name: documents
    label: Dokumenter
    input: public/media/documents
    output: /media/documents
    categories: [document]

content:
  - name: posts
    label: Nyheter, referater og arrangementer
    type: collection
    path: src/content/posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, categories]
      primary: title
      sort: [date, title]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Tittel, type: string, required: true }
      - { name: date, label: Dato, type: date, required: true, options: { time: true } }
      - name: categories
        label: Kategori
        type: select
        description: "Velg én kategori."
        default: [Nyhet]
        options:
          multiple: { min: 1, max: 1 }
          values: [Nyhet, Møter og referater, Kurs og fagdag, Sosialt og turer, Konkurranser]
      - { name: image, label: Hovedbilde, type: image, description: "Legg gjerne alltid inn et bilde fra turen, kurset eller møtet – det gjør innlegget mye mer synlig. Vises øverst i innlegget, på forsiden og i bildevisningen på Nytt. Liggende bilder blir finest. Uten bilde brukes et standardbilde for kategorien.", options: { media: images, path: public/media/posts } }
      - { name: author, label: "Skrevet av (fornavn)", type: string }
      - { name: lead, label: Ingress, type: text, description: "1–2 setninger som oppsummerer saken." }
      - name: attachments
        label: Vedlegg (PDF, referater, innkallinger)
        type: object
        list: true
        description: "Bare dokumenter som kan være offentlige (f.eks. signerte referater og årsberetninger) – alt som lastes opp her kan lastes ned av alle. Utkast, regnskap, medlemslister og andre interne dokumenter hører hjemme i klubbens Google Drive."
        fields:
          - { name: title, label: Navn på dokumentet, type: string, required: true }
          - { name: file, label: Fil, type: file, required: true, options: { media: documents } }
      - name: event
        label: Arrangement (valgfritt)
        type: object
        description: "Gjelder innlegget et kurs, en fagdag, et møte eller et sosialt treff med dato? Fyll ut starttidspunkt, så vises det også i kalenderen under Arrangementer."
        fields:
          - { name: start, label: Starter, type: date, options: { time: true } }
          - { name: end, label: Slutter, type: date, options: { time: true } }
          - { name: allDay, label: Hele dagen (ingen klokkeslett), type: boolean, default: false }
          - name: type
            label: Type
            description: "Velg fra listen. Gruppen foran / (Kurs, Fagdag, Møte, Sosialt, Konkurranse) bestemmer filter og farge i kalenderen. Kurs etter NLFs utdanningsprogrammer: PP2 = grunnkurs paragliding, SPG2 = grunnkurs speedgliding, PPG3 = motorparaglider (krever PP2), SIV = sikkerhetskurs (krav til PP4). Skriv selve kursnavnet i tittelen."
            type: select
            options: { values: ["Kurs / PP2", "Kurs / SPG2", "Kurs / PPG3", "Kurs / SIV", "Kurs / Prøvedag", "Kurs / Annet kurs", "Fagdag / Nødskjerm og vingesjekk", "Fagdag / Sikkerhetsseminar", "Fagdag / Annen fagdag", "Møte / Årsmøte", "Møte / Klubbmøte", "Møte / Styremøte", "Sosialt / Julebord", "Sosialt / Afterflight", "Sosialt / Kickoff", "Sosialt / Tur", "Konkurranse / Cup og stevne", "Konkurranse / Foto og video", "Konkurranse / Annen konkurranse"] }
          - { name: location, label: Sted (fysisk), type: string, description: "F.eks. «Seljestadhallen» eller «Sollifjellet». La stå tom hvis det bare er på nett." }
          - { name: online, label: Lenke til nettmøte, type: string, description: "Teams/Zoom/Meet-lenke hvis man kan delta digitalt." }
          - { name: organizer, label: "Arrangør (la stå tom hvis det er HPGT)", type: string, description: "F.eks. «Narvik Paragliderklubb» eller «NLF». Vises som «Arrangeres av …»." }
          - { name: signup, label: Lenke til påmelding, type: string, description: "Skjema, Min idrett eller lignende. Knappen skjules når arrangementet er over." }
      - { name: draft, label: "Utkast (forhåndsvisning)", type: boolean, default: false, description: "Med hake: innlegget vises bare på hpgt.com/utkast/ + adressen (f.eks. hpgt.com/utkast/mitt-innlegg/), 2–3 minutter etter lagring. Ikke på forsiden, under Nytt eller i søket. Fjern haken når det er klart, så publiseres det." }
      # Skjulte felt: Pages CMS fjerner felt som ikke står her når et innlegg lagres. permalink holder på
      # adressen fra WordPress (gamle lenker), wp_id er sporbarhet tilbake til WordPress.
      - { name: permalink, label: Adresse, type: string, hidden: true }
      - { name: wp_id, label: WordPress-ID, type: number, hidden: true }
      - { name: body, label: Tekst, type: rich-text, description: "Bilder i teksten tilpasses automatisk, du trenger ikke gjøre noe: alle kan klikkes for å forstørres, plakater, QR-koder og andre bilder som ikke er foto vises mindre, og flere bilder i samme avsnitt vises i rutenett. Får et bilde feil størrelse, kan du gi filen «-full» (full bredde), «-half» (halv bredde) eller «-small» (liten) sist i navnet før du laster den opp (f.eks. «kart-full.png»)." }

  - name: pages
    label: Faste sider
    type: collection
    path: src/content/pages
    view: { fields: [title], primary: title }
    fields:
      - { name: title, label: Tittel, type: string, required: true }
      - { name: lead, label: Ingress, type: text }
      - { name: image, label: Toppbilde, type: image, options: { media: images, path: public/media/pages } }
      - { name: updated, label: Sist oppdatert, type: date }
      - { name: permalink, label: Adresse, type: string, hidden: true }
      - { name: template, label: Mal, type: string, hidden: true }
      - { name: wp_id, label: WordPress-ID, type: number, hidden: true }
      # Konkurransesidene ligger også her (mappa konkurranser); feltene må stå, ellers fjernes de ved lagring
      - { name: year, label: År, type: number, hidden: true }
      - { name: winnerPhoto, label: "1. plass foto", type: string, hidden: true }
      - { name: winnerVideo, label: "1. plass video", type: string, hidden: true }
      - { name: body, label: Tekst, type: rich-text, description: "Bilder i teksten tilpasses automatisk, du trenger ikke gjøre noe: alle kan klikkes for å forstørres, plakater, QR-koder og andre bilder som ikke er foto vises mindre, og flere bilder i samme avsnitt vises i rutenett. Får et bilde feil størrelse, kan du gi filen «-full» (full bredde), «-half» (halv bredde) eller «-small» (liten) sist i navnet før du laster den opp (f.eks. «kart-full.png»)." }

  - name: courses
    label: Kurs
    type: collection
    path: src/content/courses
    filename: "{primary}.md"
    view: { fields: [title, menuOrder], primary: title, sort: [menuOrder, title], default: { sort: menuOrder, order: asc } }
    description: "Én side per kurs, f.eks. /kurs/paragliding-pp2/. Nye kurs dukker automatisk opp i kursmenyen og som kort på Kurs-siden. Datoene skrives ikke her, men i et innlegg med arrangement av samme type – da vises de øverst på kurssiden."
    fields:
      - { name: title, label: Tittel, type: string, required: true, description: "F.eks. «Grunnkurs i speedgliding (SPG2)». Adressen lages av tittelen første gang siden lagres." }
      - { name: menuTitle, label: Kort navn i kursmenyen, type: string, description: "F.eks. «Speedgliding (SPG2)». Tomt = tittelen." }
      - { name: lead, label: Ingress, type: text, description: "1–2 setninger. Vises også på kortet på Kurs-siden." }
      - { name: image, label: Toppbilde, type: image, options: { media: images, path: public/media/pages } }
      - name: courseType
        label: Kurstype
        type: select
        description: "Kommende arrangementer med denne typen vises som «Neste kurs» øverst på siden."
        options: { values: ["Kurs / PP2", "Kurs / SPG2", "Kurs / PPG3", "Kurs / SIV", "Kurs / Prøvedag", "Kurs / Annet kurs", "Fagdag / Nødskjerm og vingesjekk", "Fagdag / Sikkerhetsseminar", "Fagdag / Annen fagdag"] }
      - { name: menuOrder, label: Rekkefølge i menyen, type: number, default: 50, description: "Lavest først." }
      - { name: updated, label: Sist oppdatert, type: date }
      - { name: body, label: Tekst, type: rich-text, description: "Bilder i teksten tilpasses automatisk, du trenger ikke gjøre noe: alle kan klikkes for å forstørres, plakater, QR-koder og andre bilder som ikke er foto vises mindre, og flere bilder i samme avsnitt vises i rutenett. Får et bilde feil størrelse, kan du gi filen «-full» (full bredde), «-half» (halv bredde) eller «-small» (liten) sist i navnet før du laster den opp (f.eks. «kart-full.png»)." }

  - name: competitions
    label: Konkurranser
    type: collection
    path: src/content/pages/konkurranser
    filename: "{year}.md"
    view: { fields: [title, year], primary: title, sort: [year], default: { sort: year, order: desc } }
    description: "Én side per foto- og videokonkurranse, f.eks. /klubben/konkurranser/2027/. Dukker automatisk opp i oversikten på Konkurranser-siden. Bruk overskriftene Vinnere, Premier, Sponsorer, Innsendte bilder, Videoer og Regler – listene under Sponsorer, Innsendte bilder og Videoer vises da som logoer, bildegalleri (stort bilde over en stripe med miniatyrer, fullskjerm ved klikk) og videokort."
    fields:
      - { name: title, label: Tittel, type: string, required: true, description: "F.eks. «Foto- og videokonkurransen 2027»" }
      - { name: year, label: År, type: number, required: true }
      - { name: lead, label: Ingress, type: text }
      - { name: image, label: Toppbilde, type: image, options: { media: images, path: public/media/competitions } }
      - { name: winnerPhoto, label: "1. plass foto", type: string, description: "Vises i oversikten. Tom til vinneren er kåret." }
      - { name: winnerVideo, label: "1. plass video", type: string }
      - { name: updated, label: Sist oppdatert, type: date }
      - { name: wp_id, label: WordPress-ID, type: number, hidden: true }
      - { name: body, label: Tekst, type: rich-text, description: "Bilder i teksten tilpasses automatisk, du trenger ikke gjøre noe: alle kan klikkes for å forstørres, plakater, QR-koder og andre bilder som ikke er foto vises mindre, og flere bilder i samme avsnitt vises i rutenett. Får et bilde feil størrelse, kan du gi filen «-full» (full bredde), «-half» (halv bredde) eller «-small» (liten) sist i navnet før du laster den opp (f.eks. «kart-full.png»)." }

  - name: default-images
    label: Standardbilder
    type: file
    path: src/data/default-images.json
    format: json
    description: "Bilder som brukes på innlegg og arrangementer uten eget bilde. Legg gjerne inn flere per kategori – innleggene fordeles på dem, og hvert innlegg får alltid samme bilde. Tom liste = farge med ikon."
    fields:
      - { name: description, type: string, hidden: true }
      - { name: news, label: Nyhet, type: image, list: true, options: { media: images, path: public/media/defaults } }
      - { name: meetings, label: Møter og referater, type: image, list: true, options: { media: images, path: public/media/defaults } }
      - { name: courses, label: Kurs, type: image, list: true, options: { media: images, path: public/media/defaults } }
      - { name: trainingDays, label: Fagdag, type: image, list: true, options: { media: images, path: public/media/defaults } }
      - { name: social, label: Sosialt og turer, type: image, list: true, options: { media: images, path: public/media/defaults } }
      - { name: competitions, label: Konkurranser, type: image, list: true, options: { media: images, path: public/media/defaults } }

  - name: front-page
    label: Forsiden
    type: file
    path: src/data/front-page.json
    format: json
    fields:
      - { name: kicker, label: "Stikkord over overskriften", type: string }
      - { name: headline, label: Stor overskrift, type: string }
      - { name: headlineLead, label: Tekst under overskriften, type: text }
      - { name: heroImage, label: Toppbilde, type: image, options: { media: images, path: public/media/pages } }
      - { name: heroImageCredit, label: Bildekreditt, type: string }
      - name: course
        label: Kursblokken
        type: object
        fields:
          - { name: title, label: Tittel, type: string }
          - { name: text, label: Tekst før kurset, type: text }
          - { name: afterCourse, label: Tekst når kurset er ferdig, type: text }
          - { name: start, label: Første kursdag, type: date }
          - { name: end, label: Siste kursdag, type: date }
          - { name: deadline, label: Påmeldingsfrist, type: date }
          - { name: price, label: Pris, type: string }
          - { name: seats, label: Plasser, type: string }
          - { name: url, label: Lenke, type: string }
      - name: paths
        label: «Finn din vei inn»-kort
        type: object
        list: { max: 3 }
        fields:
          - { name: verb, label: "Etikett (Lær, Opplev …)", type: string }
          - { name: title, label: Tittel, type: string }
          - { name: text, label: Tekst, type: text }
          - { name: url, label: Lenke, type: string }
          - { name: image, label: Bilde, type: image, options: { media: images, path: public/media/pages } }
      - { name: gallery, label: Bildegalleri, type: image, list: { max: 6 }, options: { media: images, path: public/media/pages } }
      - { name: title, label: Overskrift (eldre design), type: string }
      - { name: lead, label: Ingress, type: text }
      - { name: image, label: Toppbilde, type: image, options: { media: images, path: public/media/pages } }
      - { name: caption, label: Bildetekst, type: string }
      - name: buttons
        label: Knapper
        type: object
        list: { max: 2 }
        fields: [{ name: text, label: Tekst, type: string }, { name: url, label: Lenke, type: string }]
      - name: cards
        label: Kort (Lær å fly, Tandem …)
        type: object
        list: { max: 4 }
        fields:
          - { name: title, label: Tittel, type: string }
          - { name: text, label: Tekst, type: text }
          - { name: url, label: Lenke, type: string }
          - { name: image, label: Bilde, type: image, options: { media: images, path: public/media/pages } }
          - { name: icon, type: string, hidden: true }
      - name: shortcuts
        label: Snarveier for piloter
        type: object
        list: true
        fields: [{ name: text, label: Tekst, type: string }, { name: url, label: Lenke, type: string }]

  - name: board
    label: Styret
    type: file
    path: src/data/board.json
    format: json
    fields:
      - name: members
        label: Styremedlemmer
        type: object
        list: true
        fields:
          - { name: id, label: "Kort ID (f.eks. leder)", type: string, required: true }
          - { name: role, label: Rolle, type: string, required: true }
          - { name: name, label: Navn, type: string, required: true }
          - { name: responsibility, label: "Kontakt meg om", type: text, description: "Hva medlemmer bør kontakte denne rollen om." }
          - { name: phone, label: Telefon, type: string }
          - { name: email, label: E-post, type: string }
          - { name: image, label: Bilde, type: image, options: { media: images, path: public/media/board } }

  - name: sponsors
    label: Sponsorer
    type: file
    path: src/data/sponsors.json
    format: json
    fields:
      - name: sponsors
        label: Sponsorer
        description: "Vises under «Støttet av» nederst på alle sidene, i denne rekkefølgen. Uten sponsorer vises ingenting. Logoene vises i gråtoner og får farger når man peker på dem."
        type: object
        list: true
        fields:
          - { name: name, label: Firmanavn, type: string, required: true }
          - { name: logo, label: "Logo (SVG eller PNG med gjennomsiktig bakgrunn)", type: image, required: true, description: "Tom kant rundt logoen skjæres bort, og logoen skaleres automatisk ved publisering.", options: { media: images, path: public/media/sponsors } }
          - { name: url, label: "Lenke (https://…), til forsiden eller en bestemt side hos sponsoren", type: string, required: true }
          - { name: from, label: Vises fra og med, type: date, description: "Tom = med en gang. Logoen kommer ved første publisering fra datoen." }
          - { name: until, label: Vises til og med, type: date, description: "Tom = uten sluttdato. Logoen forsvinner ved første publisering etter datoen." }

  - name: radio-id
    label: FLARM/FANET RadioID-register
    type: file
    path: src/data/radio-id.json
    format: json
    fields:
      - name: pilots
        label: Piloter
        type: object
        list: true
        fields:
          - { name: pilot, label: Fornavn, type: string, required: true }
          - { name: id, label: "RadioID (6 hex-tegn)", type: string, required: true, pattern: "^[0-9A-Fa-f]{6}$" }
          - { name: equipment, label: Vario / utstyr, type: string }
