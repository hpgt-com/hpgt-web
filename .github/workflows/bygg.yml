# Bygger siden for hver endring (også fra CMS-et) og publiserer main til Cloudflare.
# Minste privilegium: jobben kan bare lese repoet; Cloudflare-tokenet har kun «Workers Scripts: Edit» på én konto
# og ligger i miljøet «produksjon», som bare main-grenen får bruke.
name: Bygg og publiser
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: publiser, cancel-in-progress: true }
jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Fest til commit-SHA ved oppsett
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build # Feil i innholdet (f.eks. ugyldig dato) stopper her, før noe publiseres
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist, retention-days: 3 }
  publiser:
    if: github.ref == 'refs/heads/main'
    needs: bygg
    runs-on: ubuntu-latest
    environment: produksjon
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
