name: Bygg og publiser

# Bygger siden og publiserer den til Cloudflare (Workers static assets + workeren for RadioID-skjemaet)
# når main endres, også når en redaktør lagrer i Pages CMS.
#
# Fire jobber, så ingen nøkkel er tilgjengelig for mer kode enn nødvendig:
#   vakt      Pages CMS har unntak fra PR-kravet og kan lagre rett på main. Endrer en commit som ikke kom gjennom en
#             merget pull request (altså fra Pages CMS) noe annet enn innholdet (se TILLATT under), stopper publiseringen
#             her, og det lages en sak. Forfatternavnet brukes ikke, det kan settes fritt. Sjekker alt siden
#             forrige vellykkede publisering, så endringen ikke slipper gjennom med neste commit. Når filene er tilbake
#             slik de var ved forrige publisering (git revert), går det igjen.
#   oversett  oversetter ny eller endret tekst til engelsk (scripts/oversett). Logger inn hos Anthropic uten
#             lagret nøkkel: GitHubs OIDC-token for miljøet «oversetting» veksles inn (workload identity federation).
#             Installerer bare Anthropic-SDK-en, ikke nettstedets byggepakker. Uten innlogging brukes
#             oversettelsene fra forrige publisering uendret.
#   bygg      installerer pakkene og bygger, uten hemmeligheter. Resultatet leveres videre som artifact.
#   publiser  har Cloudflare-tokenet (bare «Workers Scripts: Edit» på klubbens konto), men kjører ingen npm-kode
#             fra repoet. Tokenet ligger i miljøet «produksjon», som bare main får bruke. Setter også inn skjemaenes
#             ID-er fra «produksjon» (Turnstile-nøkkelen og GitHub-appen for RadioID-skjemaet).
# Actions er festet til commit-SHA (Dependabot oppdaterer dem).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publiser
  cancel-in-progress: false

env:
  # Oversettelsene fra forrige publisering. Bytt til https://hpgt.com/en/oversettelser.json hvis workers.dev-adressen skrus av.
  OVERSETT_FORRIGE: https://hpgt-web.hpgt.workers.dev/en/oversettelser.json

jobs:
  vakt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # finne forrige vellykkede publisering
      pull-requests: read # se om en commit kom gjennom en merget pull request
      issues: write # si fra når noe stoppes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sjekk hva Pages CMS har endret
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Det redaktørene kan endre i Pages CMS (.pages.yml). Alt annet skal gå gjennom en pull request.
          TILLATT='^(src/content/(innlegg|sider|kurs)/|public/media/|src/data/(forside|styret|radioid|standardbilder)\.json$)'
          forrige=$(gh api "repos/$GH_REPO/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          if [ -z "$forrige" ] || ! git cat-file -e "$forrige^{commit}" 2>/dev/null; then
            echo "Fant ingen tidligere publisering å sammenligne med; sjekker bare siste commit."
            forrige=$(git rev-parse HEAD~1)
          fi
          echo "Sjekker $forrige..HEAD"
          # Commits uten en merget pull request er lagret rett på main, dvs. av Pages CMS.
          utenfor=$(git rev-list --no-merges "$forrige..HEAD" | while read -r c; do
            pr=$(gh api "repos/$GH_REPO/commits/$c/pulls" --jq 'map(select(.merged_at != null)) | length')
            if [ "$pr" = "0" ]; then git diff-tree --no-commit-id --name-only -r "$c"; fi
          done | grep -Ev "$TILLATT" | sort -u || true)
          if [ -z "$utenfor" ]; then echo "OK: Pages CMS har bare endret innhold."; exit 0; fi
          # Er filene tilbake slik de var ved forrige publisering (f.eks. etter git revert), er det i orden.
          mapfile -t filer <<< "$utenfor"
          if git diff --quiet "$forrige" HEAD -- "${filer[@]}"; then echo "Filene utenfor innholdet er tilbakestilt: OK."; exit 0; fi
          printf 'Commits uten pull request har endret filer utenfor innholdet:\n%s\n' "$utenfor"
          tittel="Publisering stoppet: Pages CMS endret filer utenfor innholdet"
          tekst=$(printf 'En commit lagret rett på main (uten pull request, dvs. fra Pages CMS) endret filer som bare skal endres med en pull request, så publiseringen ble stoppet (%s).\n\nFiler:\n```\n%s\n```\n\nSjekk hvem som lagret og hvorfor. Var det ikke meningen: git revert av committen i en pull request. Var det meningen: gjør endringen på nytt i en pull request. Se docs/operations.md.' "$RUN_URL" "$utenfor")
          n=$(gh issue list --state open --search "in:title \"$tittel\"" --json number,title --jq "map(select(.title == \"$tittel\")) | .[0].number // empty")
          if [ -n "$n" ]; then gh issue comment "$n" --body "$tekst"; else gh issue create --title "$tittel" --body "$tekst"; fi
          exit 1

  oversett:
    needs: vakt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: oversetting
    permissions:
      contents: read
      id-token: write # kortlivet OIDC-token som Anthropic veksler inn; ingen lagret nøkkel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm ci --ignore-scripts
        working-directory: scripts/oversett

      - run: node scripts/oversett/oversett.mjs
        env:
          # Ikke hemmelige: sier bare hvilken føderasjonsregel og tjenestekonto innloggingen gjelder (miljøvariabler i «oversetting»)
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oversatt
          path: .oversatt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  bygg:
    needs: oversett
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uten npm-cache: et bygg som publiseres, skal ikke kunne påvirkes av en cache en PR har fylt.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oversatt
          path: .oversatt

      - run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: side
          path: |
            dist
            worker
            wrangler.jsonc
          if-no-files-found: error
          retention-days: 3

  publiser:
    needs: bygg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: produksjon
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: side
          path: .

      # Skjemaenes ID-er ligger som variabler i «produksjon» (ikke hemmelige), så bare det publiserte bygget får dem.
      # PR-bygg og lokale bygg bruker Cloudflares testnøkkel for Turnstile (site.json). Sjekkes før de brukes.
      - name: Sett inn skjemaenes ID-er
        env:
          SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
          APP_ID: ${{ vars.GH_APP_ID }}
          INSTALLASJON: ${{ vars.GH_APP_INSTALLATION_ID }}
        run: |
          [[ "$APP_ID" =~ ^[0-9]+$ ]] || { echo "::error::GH_APP_ID mangler eller er ikke et tall"; exit 1; }
          [[ "$INSTALLASJON" =~ ^[0-9]+$ ]] || { echo "::error::GH_APP_INSTALLATION_ID mangler eller er ikke et tall"; exit 1; }
          [[ "$SITEKEY" =~ ^0x[0-9A-Za-z_-]{10,}$ ]] || { echo "::error::TURNSTILE_SITEKEY mangler eller har feil format"; exit 1; }
          grep -rlZ --include='*.html' '1x00000000000000000000AA' dist | xargs -0 -r sed -i "s/1x00000000000000000000AA/$SITEKEY/g"

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Fast versjon: denne jobben har Cloudflare-tokenet, så den skal ikke hente «siste» Wrangler fra npm.
          # Oppdateres for hånd (samme versjon som workers/data i hpgt-com/flying-sites).
          wranglerVersion: "4.156.0"
          command: deploy --var GH_APP_ID:${{ vars.GH_APP_ID }} --var GH_APP_INSTALLATION_ID:${{ vars.GH_APP_INSTALLATION_ID }}
