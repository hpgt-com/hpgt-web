name: Bygg og publiser

# Bygger siden og publiserer den til Cloudflare (Workers static assets + workeren for RadioID-skjemaet)
# når main endres, også når en redaktør lagrer i Pages CMS.
#
# To jobber, så kode fra repoet aldri kjører med publiseringsnøkkelen:
#   bygg      installerer pakkene og bygger, uten hemmeligheter. Resultatet leveres videre som artifact.
#   publiser  har Cloudflare-tokenet (bare «Workers Scripts: Edit» på klubbens konto), men kjører ingen npm-kode
#             fra repoet. Tokenet ligger i miljøet «produksjon», som bare main får bruke.
# Actions er festet til commit-SHA (Dependabot oppdaterer dem).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publiser
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uten npm-cache: et bygg som publiseres, skal ikke kunne påvirkes av en cache en PR har fylt.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm ci --ignore-scripts

      - run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: side
          path: |
            dist
            worker
            wrangler.jsonc
          if-no-files-found: error
          retention-days: 3

  publiser:
    needs: bygg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: produksjon
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: side
          path: .

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
