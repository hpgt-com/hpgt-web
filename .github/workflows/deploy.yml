name: Bygg og publiser

# Bygger siden og publiserer den til Cloudflare (Workers static assets + workeren for RadioID-skjemaet)
# når main endres, også når en redaktør lagrer i Pages CMS.
#
# Hver natt kjører bare jobben «dates». Den publiserer siden når en sponsor starter eller går ut den dagen
# (scripts/sponsor-dates.mjs), ellers stopper den der, uten å installere eller bygge noe.
#
# Fire jobber, så ingen nøkkel er tilgjengelig for mer kode enn nødvendig:
#   guard     Pages CMS har unntak fra PR-kravet og kan lagre rett på main. Endrer en commit som ikke kom gjennom en
#             merget pull request (altså fra Pages CMS) noe annet enn innholdet (se TILLATT under), stopper publiseringen
#             her, og det lages en sak. Forfatternavnet brukes ikke, det kan settes fritt. Sjekker alt siden
#             forrige vellykkede publisering, så endringen ikke slipper gjennom med neste commit. Når filene er tilbake
#             slik de var ved forrige publisering (git revert), går det igjen.
#   translate oversetter ny eller endret tekst til engelsk (scripts/translate). Logger inn hos Anthropic uten
#             lagret nøkkel: GitHubs OIDC-token for miljøet «translation» veksles inn (workload identity federation).
#             Installerer bare Anthropic-SDK-en, ikke nettstedets byggepakker. Uten innlogging brukes
#             oversettelsene fra forrige publisering uendret.
#   build     installerer pakkene og bygger, uten hemmeligheter. Resultatet leveres videre som artifact.
#   publish   har Cloudflare-tokenet (bare «Workers Scripts: Edit» på klubbens konto), men kjører ingen npm-kode
#             fra repoet. Tokenet ligger i miljøet «production», som bare main får bruke. Setter også inn skjemaenes
#             ID-er fra «production» (Turnstile-nøkkelen og GitHub-appen for RadioID-skjemaet).
# Actions er festet til commit-SHA (Dependabot oppdaterer dem).

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 00:15 norsk vintertid, 01:15 sommertid: alltid etter midnatt her, så sponsorene for den nye dagen vises
    - cron: "15 23 * * *"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  # Oversettelsene fra forrige publisering (den publiserte siden).
  OVERSETT_FORRIGE: https://hpgt.com/en/oversettelser.json

jobs:
  dates:
    # Om natten: publiser bare når sponsorene som vises, er andre i dag enn i går. Ellers alltid.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/sponsor-dates.mjs
            src/data/sponsors.json
          sparse-checkout-cone-mode: false

      - id: check
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          svar=$(node scripts/sponsor-dates.mjs)
          echo "Sponsorene endres i dag: $svar"
          echo "publish=$svar" >> "$GITHUB_OUTPUT"

  guard:
    needs: dates
    if: needs.dates.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # finne forrige vellykkede publisering
      pull-requests: read # se om en commit kom gjennom en merget pull request
      issues: write # si fra når noe stoppes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sjekk hva Pages CMS har endret
        shell: bash # pipefail
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Det redaktørene kan endre i Pages CMS (.pages.yml). Alt annet skal gå gjennom en pull request.
          TILLATT='^(src/content/(posts|pages|courses)/|public/media/|src/data/(front-page|board|radio-id|default-images|sponsors)\.json$)'
          # Nattkjøringene telles ikke: en natt uten sponsorendring er «vellykket» uten at denne sjekken har kjørt, og ville
          # ellers latt en stoppet endring slippe gjennom med neste commit. Den nyeste av push og manuell kjøring brukes.
          siste() { gh api "repos/$GH_REPO/actions/workflows/deploy.yml/runs?branch=main&status=success&event=$1&per_page=1" --jq '.workflow_runs[0] // empty | "\(.run_started_at) \(.head_sha)"'; }
          if ! forrige=$( { siste push; siste workflow_dispatch; } | sort | tail -n 1 | cut -d " " -f 2 ); then
            echo "::error::Kunne ikke slå opp forrige publisering. Publiseringen stoppes; kjør på nytt."
            exit 1
          fi
          # Uten kjent sammenligningsgrunnlag (forrige publiserte commit mangler, f.eks. etter omskrevet historikk) kan
          # ikke hele endringen kontrolleres. Da stoppes en automatisk publisering. En administrator kan publisere ved å
          # kjøre «Bygg og publiser» for hånd; da kontrolleres bare siste commit, og det står i loggen hvem som gjorde det.
          if [ -z "$forrige" ] || ! git cat-file -e "$forrige^{commit}" 2>/dev/null; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::warning::Fant ikke forrige publisering (${forrige:-ingen}). Kjørt for hånd av $GITHUB_ACTOR: sjekker bare siste commit."
              forrige=$(git rev-parse HEAD~1) || { echo "::error::git rev-parse feilet"; exit 1; }
            else
              echo "::error::Fant ikke forrige publisering (${forrige:-ingen}) å sammenligne med, så endringen kan ikke kontrolleres. Se over endringene og kjør «Bygg og publiser» for hånd (docs/operations.md)."
              exit 1
            fi
          fi
          echo "Sjekker $forrige..HEAD"
          # Stopper hvis noe av sjekken feiler (et GitHub-oppslag, git): da er ikke hele endringen kontrollert.
          # Bare «ingen filer utenfor innholdet» etter at alle oppslag har lyktes, slipper gjennom.
          # Git-kommandoene kjøres for seg, så en feil stopper sjekken i stedet for å gi en tom liste
          liste=$(git rev-list --no-merges "$forrige..HEAD") || { echo "::error::git rev-list feilet"; exit 1; }
          commits=(); [ -z "$liste" ] || mapfile -t commits <<< "$liste"
          filer=()
          for c in "${commits[@]}"; do
            # Commits uten en merget pull request er lagret rett på main, dvs. av Pages CMS.
            if ! pr=$(gh api "repos/$GH_REPO/commits/$c/pulls" --jq 'map(select(.merged_at != null)) | length'); then
              echo "::error::Kunne ikke slå opp om $c kom gjennom en pull request. Publiseringen stoppes; kjør på nytt."
              exit 1
            fi
            [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::error::Uventet svar for $c: «$pr»"; exit 1; }
            if [ "$pr" = "0" ]; then
              liste=$(git diff-tree --no-commit-id --name-only -r "$c") || { echo "::error::git diff-tree feilet for $c"; exit 1; }
              [ -z "$liste" ] || { mapfile -t endret <<< "$liste"; filer+=("${endret[@]}"); }
            fi
          done
          echo "${#commits[@]} commits sjekket, ${#filer[@]} filer endret uten pull request."
          # grep gir 1 når ingen linjer er utenfor (det er i orden), 2 ved feil (da stopper vi).
          utenfor=$( { [ "${#filer[@]}" -eq 0 ] || printf '%s\n' "${filer[@]}"; } | { grep -Ev "$TILLATT" || [ $? -eq 1 ]; } | sort -u)
          if [ -z "$utenfor" ]; then echo "OK: Pages CMS har bare endret innhold."; exit 0; fi
          # Er filene tilbake slik de var ved forrige publisering (f.eks. etter git revert), er det i orden.
          mapfile -t filer <<< "$utenfor"
          if git diff --quiet "$forrige" HEAD -- "${filer[@]}"; then echo "Filene utenfor innholdet er tilbakestilt: OK."; exit 0; fi
          printf 'Commits uten pull request har endret filer utenfor innholdet:\n%s\n' "$utenfor"
          tittel="Publisering stoppet: Pages CMS endret filer utenfor innholdet"
          tekst=$(printf 'En commit lagret rett på main (uten pull request, dvs. fra Pages CMS) endret filer som bare skal endres med en pull request, så publiseringen ble stoppet (%s).\n\nFiler:\n```\n%s\n```\n\nSjekk hvem som lagret og hvorfor. Var det ikke meningen: git revert av committen i en pull request. Var det meningen: gjør endringen på nytt i en pull request. Se docs/operations.md.' "$RUN_URL" "$utenfor")
          n=$(gh issue list --state open --search "in:title \"$tittel\"" --json number,title --jq "map(select(.title == \"$tittel\")) | .[0].number // empty")
          if [ -n "$n" ]; then gh issue comment "$n" --body "$tekst"; else gh issue create --title "$tittel" --body "$tekst"; fi
          exit 1

  translate:
    needs: guard
    runs-on: ubuntu-latest
    # Første gang oversettes alle innleggene (noen minutter); senere bare nye eller endrede tekster
    timeout-minutes: 30
    environment: translation
    permissions:
      contents: read
      id-token: write # kortlivet OIDC-token som Anthropic veksler inn; ingen lagret nøkkel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm ci --ignore-scripts
        working-directory: scripts/translate

      - run: node scripts/translate/translate.mjs
        env:
          # Ikke hemmelige: sier bare hvilken føderasjonsregel og tjenestekonto innloggingen gjelder (miljøvariabler i «translation»)
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: translated
          path: .translated
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  build:
    needs: translate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uten npm-cache: et bygg som publiseres, skal ikke kunne påvirkes av en cache en PR har fylt.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: translated
          path: .translated

      - run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: side
          path: |
            dist
            worker
            wrangler.jsonc
          # Med skjulte filer, ellers forsvinner dist/.well-known/ (security.txt) på veien til publiseringen.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      # Bare deploy/ (Wrangler med låsefil) og .nvmrc, ingen annen kode fra repoet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            deploy
            .nvmrc
          sparse-checkout-cone-mode: false

      # Ingen npm-cache: en jobb som publiserer skal ikke hente filer en annen kjøring kan ha skrevet
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Wrangler i nøyaktig versjonen og med de avhengighetene som står i deploy/package-lock.json, uten installasjonsskript.
      # Oppdateres av Dependabot (samme versjon som workers/data i hpgt-com/flying-sites).
      - run: npm ci --ignore-scripts
        working-directory: deploy

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: side
          path: .

      # Skjemaenes ID-er ligger som variabler i «production» (ikke hemmelige), så bare det publiserte bygget får dem.
      # PR-bygg og lokale bygg bruker Cloudflares testnøkkel for Turnstile (site.json). Sjekkes før de brukes.
      - name: Sett inn skjemaenes ID-er
        env:
          SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
          APP_ID: ${{ vars.GH_APP_ID }}
          INSTALLASJON: ${{ vars.GH_APP_INSTALLATION_ID }}
        run: |
          [[ "$APP_ID" =~ ^[0-9]+$ ]] || { echo "::error::GH_APP_ID mangler eller er ikke et tall"; exit 1; }
          [[ "$INSTALLASJON" =~ ^[0-9]+$ ]] || { echo "::error::GH_APP_INSTALLATION_ID mangler eller er ikke et tall"; exit 1; }
          [[ "$SITEKEY" =~ ^0x[0-9A-Za-z_-]{10,}$ ]] || { echo "::error::TURNSTILE_SITEKEY mangler eller har feil format"; exit 1; }
          grep -rlZ --include='*.html' '1x00000000000000000000AA' dist | xargs -0 -r sed -i "s/1x00000000000000000000AA/$SITEKEY/g"

      - name: Publiser til Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ID: ${{ vars.GH_APP_ID }}
          INSTALLASJON: ${{ vars.GH_APP_INSTALLATION_ID }}
        run: deploy/node_modules/.bin/wrangler deploy --config wrangler.jsonc --var "GH_APP_ID:$APP_ID" --var "GH_APP_INSTALLATION_ID:$INSTALLASJON"
