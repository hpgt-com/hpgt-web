name: Utløper snart

# Varsler om tokens, nøkler og domenet før de utløper (settings/utlop.json: bare navn og datoer, aldri verdier).
# Hver mandag: for hvert element som utløper innen varsel_dager (45 hvis ikke satt), eller har utløpt, lages en sak
# (én per element, med navnet i tittelen). Saken lukkes av seg selv når datoen er flyttet fram i fila. Kjører ingen kode
# fra repoet utover å lese fila. På en pull request som endrer fila, sjekkes bare at den er gyldig.

on:
  schedule:
    - cron: "37 6 * * 1" # mandager 06:37 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [settings/utlop.json, .github/workflows/utlop.yml]
  pull_request:
    paths: [settings/utlop.json, .github/workflows/utlop.yml]

permissions: {}

jobs:
  sjekk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: settings/utlop.json
          sparse-checkout-cone-mode: false

      - name: Sjekk utløpsdatoene
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HENDELSE: ${{ github.event_name }}
        run: |
          fil=settings/utlop.json
          # Gyldig fil: navn på alle, og datoer som YYYY-MM-DD eller null
          jq -e '.elementer | type == "array" and length > 0 and all(.[]; (.navn | type == "string" and length > 0) and (.utloper == null or (.utloper | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))))' "$fil" > /dev/null \
            || { echo "::error::$fil er ugyldig: hvert element trenger «navn» og «utloper» som YYYY-MM-DD eller null"; exit 1; }
          idag=$(date -u +%F)
          oppsummering="| Hva | Utløper | Dager igjen |"$'\n'"|---|---|---|"
          while IFS= read -r e; do
            navn=$(jq -r .navn <<< "$e"); dato=$(jq -r '.utloper // empty' <<< "$e"); varsel=$(jq -r '.varsel_dager // 45' <<< "$e")
            tittel="Utløper snart: $navn"
            if [ -z "$dato" ]; then
              oppsummering+=$'\n'"| $navn | – | $(jq -r '.merknad // "utløper ikke"' <<< "$e") |"
              continue
            fi
            igjen=$(( ($(date -u -d "$dato" +%s) - $(date -u -d "$idag" +%s)) / 86400 ))
            oppsummering+=$'\n'"| $navn | $dato | $igjen |"
            [ "$HENDELSE" = "pull_request" ] && continue
            n=$(gh issue list --state open --search "in:title \"$tittel\"" --json number,title --jq "map(select(.title == \"$tittel\")) | .[0].number // empty")
            if [ "$igjen" -le "$varsel" ]; then
              if [ -z "$n" ]; then
                if [ "$igjen" -lt 0 ]; then status="**utløpte $dato** ($(( -igjen )) dager siden)"; else status="utløper **$dato** (om $igjen dager)"; fi
                gh issue create --title "$tittel" --body "$navn $status.

          - **Brukes av:** $(jq -r '.brukes_av // "–"' <<< "$e")
          - **Slik fornyes det:** $(jq -r '.fornyes // "–"' <<< "$e")

          Når det er fornyet: sett ny dato for «$navn» i \`settings/utlop.json\` (pull request). Da lukkes saken av seg selv neste mandag, eller med en gang når endringen er merget."
                echo "::warning::$navn: $igjen dager igjen, sak opprettet"
              else
                echo "::warning::$navn: $igjen dager igjen, sak #$n er allerede åpen"
              fi
            elif [ -n "$n" ]; then
              gh issue close "$n" --comment "Fornyet: ny utløpsdato $dato i settings/utlop.json."
            fi
          done < <(jq -c '.elementer[]' "$fil")
          echo "$oppsummering" >> "$GITHUB_STEP_SUMMARY"
