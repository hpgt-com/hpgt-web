name: PR-sjekk

# Bygger siden for hver PR mot main, også de som kommer fra Pages CMS. Et ugyldig felt i innholdet
# (f.eks. en dato eller en arrangementstype som ikke finnes) stopper her, før det når main.
# Publiserer ingenting. Jobbnavnet «build» er en påkrevd sjekk i regelsettet (github.json i hpgt-com/operations).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: ingen pakke får kjøre installasjonsskript (ingen av avhengighetene trenger det).
      - run: npm ci --ignore-scripts

      # Validerer alt innhold mot skjemaene i src/content.config.ts og bygger alle sidene.
      # Engelske sider bygges fra de publiserte oversettelsene (ingen nøkkel her, ingenting oversettes).
      - run: npm run build
        env:
          OVERSETT_FORRIGE: https://hpgt.com/en/oversettelser.json

      # Workeren for RadioID-skjemaet skal i det minste være gyldig JavaScript.
      - run: node --check worker/index.js

      # Workeren og den bygde siden pakkes av Wrangler fra deploy/ (samme versjon som publiseringen bruker), uten å
      # publisere og uten nøkler. En Wrangler-versjon som ikke virker, eller en feil i wrangler.jsonc, stopper her og
      # ikke i publiseringen etter merge. Derfor kan Dependabot-oppdateringer av Wrangler merges automatisk.
      - run: npm ci --ignore-scripts
        working-directory: deploy
      - name: Workeren pakkes av wrangler
        run: deploy/node_modules/.bin/wrangler deploy --dry-run --config wrangler.jsonc --outdir "$RUNNER_TEMP/worker"
        env:
          WRANGLER_SEND_METRICS: "false"

      # Anthropic-SDK-en (scripts/translate) brukes bare ved publisering, med innlogging. Her lastes den og startes uten
      # nøkkel og uten nett, så en oppdatering som ikke kan importeres eller ikke kan lage en klient, stopper her.
      - run: npm ci --ignore-scripts
        working-directory: scripts/translate
      - name: Anthropic-SDK-en kan lastes
        working-directory: scripts/translate
        run: node --input-type=module -e 'const { default: Anthropic } = await import("@anthropic-ai/sdk"); new Anthropic({ apiKey: "test" }); console.log("ok");'

      # Enhetstester for skjemaendepunktet og Markdown-oppsettet (Node-testkjøreren, uten nettleser eller nettverk).
      - run: npm test

      # Alle interne lenker og bilder i den bygde siden peker til noe som finnes.
      - run: node scripts/check-links.mjs

      # Tilgjengelighet (axe-core) på et utvalg sider i lys og mørk modus, som på flysteder.hpgt.com. Bruker Chrome som
      # allerede er installert på GitHubs runnere, så ingen nettleser lastes ned. Kontrast og etiketter stopper her.
      - run: node scripts/check-accessibility.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome

      # Ytelsesbudsjett per side (bytes per type, forespørsler, DOM-noder, layoutskift) i Chrome, med andre verter blokkert.
      - run: npm run check:budget
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome

      # Ende-til-ende-tester (test/e2e/) i Chrome mot den bygde siden, med de samme hodene, videresendingene og den
      # samme Workeren som i drift (scripts/serve-dist.mjs). Alle andre verter er blokkert, så testene trenger ikke nett.
      - run: npm run test:e2e
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
