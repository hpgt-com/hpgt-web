name: Automatisk merge av Dependabot

# Slår på automatisk merge for Dependabot-PR-er som oppfyller kriteriene i
# https://github.com/hpgt-com/guidelines/blob/main/github-security.md#automatisk-merge:
# patch eller minor av npm-pakker og GitHub Actions. PR-en merges først når alle påkrevde sjekker er grønne
# (regelsettet på main). Den påkrevde sjekken «build» bygger siden og kjører enhetstestene, lenkesjekken,
# tilgjengeligheten, ytelsesbudsjettet og ende-til-ende-testene, så en oppdatering som bryter noe av det, blir stående.
# Wrangler er med, fordi «build» også pakker Workeren med wrangler uten å publisere, og det samme gjelder
# Anthropic-SDK-en, som «build» laster og starter. Major-oppdateringer merges manuelt.
#
# Actions merges med GITHUB_TOKEN: en merge med det starter ikke publiseringen, men oppdaterte actions endrer ikke
# innholdet på siden og tas i bruk ved neste publisering.
#
# npm merges med et token fra GitHub-appen «HPGT Web Dependabot», så merge starter publiseringen. Med
# pull_request_target får jobben de vanlige secretene, ikke Dependabot-secretene, så nøkkelen APP_PRIVATE_KEY ligger i
# miljøet «automerge» (bare main). Client ID står i repovariabelen APP_CLIENT_ID (ikke hemmelig). Så lenge den
# mangler, merges npm manuelt.
#
# pull_request_target: arbeidsflyten kjører alltid versjonen fra main og sjekker ikke ut koden i PR-en.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] ingen checkout, kjører ingen kode fra PR-en
    branches: [main]

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      npm: ${{ steps.decide.outputs.npm }}
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - id: decide
        name: Vurder kriteriene
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          NAMES: ${{ steps.metadata.outputs.dependency-names }}
          HAS_APP: ${{ vars.APP_CLIENT_ID != '' }}
        run: |
          actions=false; npm=false; reason=""
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *) reason="oppdateringstypen er ${UPDATE_TYPE:-ukjent}" ;;
          esac
          case "$ECOSYSTEM" in
            github_actions) [ -n "$reason" ] || actions=true ;;
            npm_and_yarn)
              [ "$HAS_APP" = true ] || reason="${reason:+$reason, }npm trenger appen (repovariabelen APP_CLIENT_ID mangler)"
              [ -n "$reason" ] || npm=true ;;
            *) reason="${reason:+$reason, }økosystemet er ${ECOSYSTEM:-ukjent}" ;;
          esac
          [ -z "$reason" ] || echo "::notice::Merges manuelt ($NAMES): $reason."
          echo "actions=$actions" >> "$GITHUB_OUTPUT"
          echo "npm=$npm" >> "$GITHUB_OUTPUT"

      - name: Slå på automatisk merge (Actions)
        if: steps.decide.outputs.actions == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR"

  automerge-npm:
    needs: automerge
    if: needs.automerge.outputs.npm == 'true' && vars.APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: automerge
    permissions: {}
    steps:
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Slå på automatisk merge (npm)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR"
